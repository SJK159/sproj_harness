[project]
name = "sproj_harness"
version = "0.1.0"
description = "LUMS Process Orchestrator: deep agent core for force enrollment against a mock Zambeel"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "langgraph",
    "langchain",
    "langgraph-checkpoint-sqlite",
    "langchain-openai",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real model (skipped unless RUN_LIVE=1)"]
